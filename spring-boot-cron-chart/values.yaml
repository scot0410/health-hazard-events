# Cluster Deployment Coordinates
schedule: "0 * * * *" # Triggers at the start of every hour
concurrencyPolicy: Forbid # Prevents overlapping jobs if a execution hangs
backoffLimit: 3 # Maximum retries before declaring a Job execution failed

# History Retentions
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 5

# Hard Application Timeout Constraints
activeDeadlineSeconds: 300 # Terminate the container forcefully if stuck over 5 mins

# Container Engine Blueprint
image:
  repository: ://your-registry.com
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# Structural Resource Allocation Profiles
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Application Environment Variables for Spring Boot 4 relaxed binding
env:
  springProfile: "prod"
  kafkaBootstrapServers: "prod-kafka-cluster.infra.svc.cluster.local:9092"
  kafkaRetries: "5"
  kafkaMaxBlockMs: "5000"
  kafkaDeliveryTimeoutMs: "15000"

# Node Placement and Security Profiles
nodeSelector: {}
tolerations: []
affinity: {}