apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-sync-job
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Chart.Name }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          # Production Security Best Practice: Restrict file system write access
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: {{ .Chart.Name }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                {{- toYaml .Values.resources | nindent 14 }}
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: {{ .Values.env.springProfile | quote }}
                - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
                  value: {{ .Values.env.kafkaBootstrapServers | quote }}
                - name: SPRING_KAFKA_PRODUCER_PROPERTIES_MAX_BLOCK_MS
                  value: {{ .Values.env.kafkaMaxBlockMs | quote }}
                - name: SPRING_KAFKA_PRODUCER_PROPERTIES_DELIVERY_TIMEOUT_MS
                  value: {{ .Values.env.kafkaDeliveryTimeoutMs | quote }}
          restartPolicy: OnFailure
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
          affinity:
            {{- toYaml .Values.affinity | nindent 12 }}
