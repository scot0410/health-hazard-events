spring.application.name=events

spring.config.import = optional:file:.env[.properties]

# FDA API Key Configuration
fda.api.key=${FDA_API_KEY:default_or_mock_key}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
fda.kafka.sync-topic=${FDA_SYNC_TOPIC:fda-recalls-topic}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
# Max time a send() invocation can block waiting for cluster metadata
#spring.kafka.producer.properties.max.block.ms=5000
# Max time allowed for complete message acknowledgment before failing
#spring.kafka.producer.properties.delivery.timeout.ms=10000

## 1. Wait up to 20 milliseconds to see if more records are coming before sending a network packet
#spring.kafka.producer.properties.linger.ms=20
#
## 2. Increase the packet batch size limit to 64KB (Default is 16KB)
#spring.kafka.producer.properties.batch.size=65536
#
## 3. Turn on compression to shrink JSON payloads over the wire
#spring.kafka.producer.properties.compression.type=gzip
