spring.application.name=events

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.serialization.StringSerializer
spring.kafka.producer.retries=3
# Max time a send() invocation can block waiting for cluster metadata
spring.kafka.producer.properties[max.block.ms]=5000
# Max time allowed for complete message acknowledgment before failing
spring.kafka.producer.properties[delivery.timeout.ms]=10000